services:
  temporal:
    image: temporalio/auto-setup:1.29.7
    # The auto-setup wrapper in 1.29.x does not support SQLite persistence; start-dev does via --db-filename.
    # This relies on the auto-setup image also shipping the temporal CLI, which is not part of its contract.
    # Re-verify that binary is present at this path before upgrading the pinned image version.
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/tmp/temporal.db"]
    environment:
      DB: sqlite
      DBNAME: /tmp/temporal.db
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RUN_MODE: api
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_A_URL: http://api:3000/supplierA
      SUPPLIER_B_URL: http://api:3000/supplierB
      PORT: 3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RUN_MODE: worker
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_A_URL: http://api:3000/supplierA
      SUPPLIER_B_URL: http://api:3000/supplierB
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: on-failure

networks:
  default:
    name: hotel-offer-orchestrator
